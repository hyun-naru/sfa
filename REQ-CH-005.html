<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="Shortcut Icon" href="./resources/pt/images/fav/favicon.png">
    <link rel="stylesheet" type="text/css" href="./WEB-INF/jsp/frame/pt/cssLib.css" />

    <script src="./resources/comm/js/jquery-3.5.1.min.js"></script>
    <script src="./resources/comm/js/jquery.form.min.js"></script>
    <script src="./resources/comm/js/jquery.serializeObject.min.js"></script>
    <script src="./resources/comm/js/jquery-ui.js"></script>
    <script src="./resources/comm/js/jquery.ui.monthpicker.js"></script>
    <script src="./resources/comm/js/jquery.cookie.js"></script>
    <script src="./resources/comm/js/jquery.blockUI.js"></script>
    <script src="./resources/comm/js/jquery.MultiFile.js"></script>
    <script src="./resources/comm/js/swiper.min.js"></script>
    <script src="./resources/comm/js/lightslider.js"></script>
    <script src="./resources/comm/js/common-transaction.js"></script>
    <script src="./resources/comm/js/common-numeral.min.js"></script>
    <script src="./resources/comm/js/common-moment.min.js"></script>
    <script src="./resources/comm/js/common-str.js"></script>
    <script src="./resources/comm/js/common-util.js"></script>
    <script src="./resources/comm/js/common-code.js"></script>
    <script src="./resources/comm/js/common-storage.js"></script>
    <script src="./resources/comm/js/common-timeout.js"></script>
    <script src="./resources/comm/js/sfaApp.interface.js"></script>
    <script src="./resources/pt/js/ui.front.js"></script>
    <script src="./resources/pt/js/pt.common.js"></script>
    <link rel="stylesheet" type="text/css" href="./resources/tab/pt/css/chat.css" />
    <script src="./resources/tab/pt/js/chat.js"></script>
    <title>채팅 상담 팝업</title>
    <script>
        let isMoLanding = false;	//모바일 랜딩의 경우
        $(document).ready(function () {
            layout.init(); 
            ui.init(); 
        });
    </script>
    <style>
    </style>
</head>
<body>
<div class="wrapper" id="wrapper">
    <div class="chat-container">
        <div class="chat-header">
            <span>고객상담 채팅</span>
        </div>
        <div class="chat-content">
            <div class="btn-group">
                <button type="button" class="btn-toggle-flow" id="btnToggleFlow">ai 챗봇 열기 ▼</button>    
            </div>
            <div class="chat-flow" id="chatFlow" role="region" aria-label="대화 진행 영역">
                <button type="button" class="btn_navy_dark m btn-floating" id="btnBack" aria-controls="chatFlow" aria-label="처음 단계로 돌아가기">처음으로</button>
                <div class="flow-box" id="flow01">
                    <div class="flow-content">
                        <div class="df-end">
                            <button type="button" class="btn_primary_reverse m">생일/상령일 도래(10명)</button>
                            <button type="button" class="btn_red_reverse m">실효임박 or 당월실효(2명)</button>
                        </div>
                        <div class="q-box">
                            안녕하세요. AI 영업지원봇입니다.<br>
                        무엇을 도와드릴까요?
                        </div>
                        <div class="btn-area">
                            <button type="button" id="REQ-CH-002" class="btn_white l">모니터링 결과</button>
                            <button type="button" id="REQ-CH-003" class="btn_white l">반송</button>
                            <button type="button" id="REQ-CH-004" class="btn_white l">청약서 재발송</button>
                            <button type="button" id="REQ-CH-005" class="btn_white l">가입설계서 재발송</button>
                            <button type="button" id="REQ-CH-006" class="btn_white l">증권 재발송</button>
                            <button type="button" id="REQ-CH-010" class="btn_white l">사용인 확인(인사화면)</button>
                            <button type="button" id="REQ-CH-011" class="btn_white l">일반 Q&A</button>
                        </div>
                    </div>
                </div>
                <div class="flow-box" id="flow02">
                    <div class="flow-content">
                        <div class="q-box">
                            가입설계서 재발송 대상을 검색해 주세요.
                        </div>
                        <div class="iptWrap search active_searchBtn">
                            <input type="text" class="ipt search active_searchBtn uiAct" placeholder="고객명 또는 증권번호 검색" value="" title="고객명 또는 증권번호">
                            <button type="button" class="icoBtn_search" aria-label="검색"></button>
                            <button class="icoBtn_del" tabindex="-1"><span class="blind">해당 필드 입력값 삭제</span></button>
                        </div>
                        <div class="list-btn">
                            <div>
                                <input type="radio" name="selectItem" id="item1" class="blind">
                                <label for="item1" class="btn-label">
                                    <span class="tit"><span>증권번호 : </span><span>12345678</span></span>
                                    <span class="info"><span>지점 : </span><span>에이플러스에셋</span></span>
                                    <span class="info"><span>판매인 : </span><span>미결</span></span>
                                    <span class="info"><span>청약일 : </span><span>YYMMDD</span></span>
                                    <span class="info"><span>계약자 : </span><span>이하나(800303/여)</span></span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="selectItem" id="item2" class="blind">
                                <label for="item2" class="btn-label">
                                    <span class="tit"><span>증권번호 : </span><span>12345678</span></span>
                                    <span class="info"><span>지점 : </span><span>에이플러스에셋</span></span>
                                    <span class="info"><span>판매인 : </span><span>미결</span></span>
                                    <span class="info"><span>청약일 : </span><span>YYMMDD</span></span>
                                    <span class="info"><span>계약자 : </span><span>이하나(800303/여)</span></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="btn-area action-btn">
                        <button type="button" class="btn_white l">이전</button>
                        <button type="button" class="btn_primary l">확인</button>
                    </div>
                </div>
                <div class="flow-box" id="flow03">
                    <div class="flow-content">
                        <div class="q-box">
                            가입설계서 재발송 대상자를 선택해주세요.
                        </div>
                        <div>
                            <ul class="iptFilt div_2">
                                <li>
                                    <input type="radio" class="ipt" name="iptFilt4" id="iptFilt4_1">
                                    <label for="iptFilt4_1">계약자 : 이하나 (010-1234-5678)</label>
                                </li>
                                <li>
                                    <input type="radio" class="ipt" name="iptFilt4" id="iptFilt4_2" checked="">
                                    <label for="iptFilt4_2">피보험자 : 이하나 (010-1234-5678)</label>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="btn-area action-btn">
                        <button type="button" class="btn_white l">이전</button>
                        <button type="button" class="btn_primary l">확인</button>
                    </div>
                </div>
                <div class="flow-box" id="flow04">
                    <div class="q-box">
                        요청하신 가입설계서 재발송이 완료되었습니다.
                    </div>
                </div>
            </div>      
            <!-- id="chatLive" 및 collapsed 클래스 적용 -->
            <div class="chat-live collapsed" id="chatLive">
                <div class="chat-messages" id="chatMessages">
                    <div class="message received">안녕하세요! 무엇을 도와드릴까요?</div>
                </div>
                
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" title="메시지 입력 필드">
                    <button type="button" onclick="sendMessage()" aria-label="메시지 전송" class="btn-send">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
</script>
</body>
</html>
