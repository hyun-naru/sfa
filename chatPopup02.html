    <style>
        body,html,
        .wrapper {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* PC 윈도우 팝업 스타일 */
        .chat-container {
            width: 100%;
            height: 799px;
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* 헤더 - 하나생명(하나금융) 시그니처 컬러 적용 */
        .chat-header {

            color: #ffffff;
            padding: 16px 20px;
            font-size: 1.6rem;
            font-weight: bold;
            min-height: 58px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-live-btn {
            position:relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
        }
        .chat-content {
            position: relative;
            display: flex;
            justify-content: space-between;
            height: calc(100% - 58px); /* 헤더 높이 제외 */
        }
        .chat-content > div:not(.chat-live-btn) {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-content .chat-flow { 
            position: relative;
            padding: 20px;
            font-size: 1.5rem;
            line-height: 1.6;
            gap: 12px;
            overflow-y: auto;
        }
        .chat-live {
            border-left: 1px solid #f1f3f5;
        }
        .chat-content .flow-box > div {  
            margin-top: 12px;
        }
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;      
            padding: 20px;
            height: calc(100% - 63px);
            overflow-y: auto;
        }

        /* 말풍선 공통 속성 */
        .message {

        .chat-input-area input {

            border-radius: 20px;

            font-size: 1.4rem;

        .chat-input-area input:focus {

        .chat-input-area button {

<script>
    document.addEventListener('DOMContentLoaded', function() {
    // 요소를 변수에 할당
    const btnBack = document.getElementById('btnBack');
    const flow01 = document.getElementById('flow01');
    const flow02 = document.getElementById('flow02');
    const flow03 = document.getElementById('flow03');
    const flow04 = document.getElementById('flow04');
        const flowBoxes = document.getElementsByClassName('flow-box');


    const searchInput = flow02.querySelector('.ipt.search');
    const searchBtn = flow02.querySelector('.icoBtn_search');
    const delBtn = flow02.querySelector('.icoBtn_del');
    const listBtnArea = flow02.querySelector('.list-btn');

        // 토글 제어 요소
        const chatLive = document.getElementById('chatLive');

        
        for (let i = 0; i < flowBoxes.length; i++) {
            flowBoxes[i].setAttribute('tabindex', '-1'); // 프로그래밍 방식 포커스 허용
        }
        // 초기화 함수
        function initFlow(isUserAction = false) {
            switchFlow(flow01);
            btnBack.style.display = 'none';

            if (searchInput) searchInput.value = '';
            if (listBtnArea) listBtnArea.style.display = 'none';

            if (isUserAction) {
                flow01.focus();
            }
        }
        // 화면 단계 전환 공통 함수
        function switchFlow(targetFlow) {
            [flow01, flow02, flow03, flow04].forEach(f => f.style.display = 'none');
            
            targetFlow.style.display = 'block';
            targetFlow.focus(); // [핵심] 변경된 영역으로 포커스 이동하여 음성 출력 유도
        }
    initFlow();

        btnBack.addEventListener('click', function() {
            initFlow(true);
        });

    // 1. flow01: 아무 버튼이나 클릭해도 flow02로 이동
    flow01.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;

            switchFlow(flow02);
            btnBack.style.display = 'block';
            
            setTimeout(() => {
                const searchInput = flow02.querySelector('.ipt.search');
                if (searchInput) searchInput.focus();
            }, 50);
    });

    // 2. flow02: 검색 기능 및 리스트 노출
    function executeSearch() {
            if (listBtnArea) {
                listBtnArea.style.display = 'flex';
                const firstItem = listBtnArea.querySelector('button');
                if (firstItem) firstItem.focus();
            }
    }

        if (searchBtn) searchBtn.addEventListener('click', executeSearch);

        if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            executeSearch();
        }
    });
        }

        if (delBtn) {
    delBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.focus();
                if (listBtnArea) listBtnArea.style.display = 'none';
    });
        }

    // 3. flow02: 검색된 고객 선택 -> flow03으로 이동
    listBtnArea.addEventListener('click', function(e) {
        const labelBtn = e.target.closest('.btn_label');
        if (!labelBtn) return;

        const titElement = labelBtn.querySelector('.tit').cloneNode(true);
        titElement.querySelectorAll('.blind, .flag').forEach(el => el.remove());
        const customerName = titElement.textContent.trim();

        flow03.innerHTML = `
            ${customerName} 고객님의 모니터링 재발송을 <br>요청하시겠습니까?
            <div class="btn_area">
                <button type="button" class="btn_white m btn-yes">네</button>
                <button type="button" class="btn_white m btn-no">아니오</button>
            </div>
        `;

            switchFlow(flow03);
    });

    // 4. flow03: 네 / 아니오 선택 처리
    flow03.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;

        if (btn.classList.contains('btn-yes') || btn.textContent.trim() === '네') {
                switchFlow(flow04);
        } else {
                switchFlow(flow02);
        }
    });
});














    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');

    // 1. 엔터키 입력 처리
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // 2. 메시지 전송 로직 (입력 -> 화면 출력 -> 서버 전송)
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        // UI에 내 메시지 추가
        appendMessage(text, 'sent');
        messageInput.value = '';

        /* 
         * [서버 전송 API 구현부]
         * 실제 프로젝트 적용 시 아래 주석된 Fetch API 혹은 WebSocket 로직으로 교체하세요.
         * 
         * fetch('/api/chat/send', {
         *     method: 'POST',
         *     headers: { 'Content-Type': 'application/json' },
         *     body: JSON.stringify({ message: text })
         * })
         * .then(response => response.json())
         * .then(data => { console.log('전송 성공'); })
         * .catch(error => { console.error('전송 실패:', error); });
         */
        console.log('서버로 메시지 전송됨:', text);

        // 테스트용: 전송 1초 후 서버에서 답변이 온 것처럼 시뮬레이션
        setTimeout(() => {
            receiveMessage('전송하신 "' + text + '"에 대한 서버 응답입니다.');
        }, 1000);
    }

    // 3. 메시지 수신 로직 (서버 -> 화면 출력)
    function receiveMessage(text) {
        /*
         * [서버 수신 로직 구현부]
         * 웹소켓(WebSocket)의 onmessage 이벤트 핸들러나 API 폴링 결과 콜백 안에서
         * 이 함수를 호출하여 화면에 수신 메시지를 그려줍니다.
         */
        console.log('서버로부터 메시지 수신됨:', text);
        appendMessage(text, 'received');
    }

    // 4. 화면(DOM)에 말풍선을 그리고 스크롤을 맨 아래로 내리는 유틸리티 함수
    function appendMessage(text, type) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', type);
        messageDiv.textContent = text;
        
        chatMessages.appendChild(messageDiv);
        
        // 새 메시지가 추가될 때마다 스크롤을 최하단으로 자동 이동
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>
